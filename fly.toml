# fly.io config for taskflow-server. See server/README.md for the steps.
# `fly launch --no-deploy --copy-config --name <app>` fills in `app`.

app = "taskflow-server-CHANGE-ME"
primary_region = "lhr"

[env]
  # Your timezone: day boundaries and work hours are computed in it.
  TZ = "Europe/London"
  # Origins allowed to call the backend: the hosted app. Add yours, comma-separated,
  # if you serve the frontend somewhere else (e.g. http://localhost:5173 for dev).
  ALLOWED_ORIGINS = "https://grge.github.io"
  DATA_DIR = "/data"

# The SQLite file lives on a volume. Exactly one machine: the backend is the
# single writer, and a volume belongs to one machine.
[[mounts]]
  source = "taskflow_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop when no device is connected, start on the next request (a second or
  # two). An open app tab holds its stream open, so this only stops the machine
  # when nobody is using it. Set to "off" and min_machines_running = 1 to keep
  # it always on.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
