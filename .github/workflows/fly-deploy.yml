# Deploys the sync backend (fly.toml) when something in its image changes:
# the paths below are what the Dockerfile copies. Tests must pass first.
name: Fly Deploy
on:
  push:
    branches: [master]
    paths:
      - server/**
      - src/core/**
      - src/lib/**
      - '!src/lib/components/**'
      - scripts/core-version.mjs
      - package.json
      - package-lock.json
      - Dockerfile
      - .dockerignore
      - fly.toml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      # One machine only: the backend is the single writer.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
